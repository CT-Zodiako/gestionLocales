server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PWA: the service worker, its loader, the manifest and the HTML shell must always be revalidated,
  # otherwise browsers keep an old worker (and with it an old app) for as long as the file is cached.
  # Everything else under /assets is content-hashed.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache";
  }

  # nginx's mime.types has no entry for .webmanifest, so the type is set explicitly.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: unknown paths fall back to index.html so React Router handles them.
  location / {
    try_files $uri /index.html;
  }
}
