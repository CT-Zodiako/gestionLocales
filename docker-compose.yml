services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestion}
      POSTGRES_DB: ${POSTGRES_DB:-gestion}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion} -d ${POSTGRES_DB:-gestion}"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gestion}:${POSTGRES_PASSWORD:-gestion}@postgres:5432/${POSTGRES_DB:-gestion}
      RUN_MIGRATIONS: "true"
      # Dev-only defaults: replace both for any shared or public deployment.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-better-auth-secret-change-me-0123456789}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      # WhatsApp bot: empty means disabled (the webhook answers 404). Never put real values in this file:
      # export them in the shell or an untracked .env when starting the stack. Set all three of
      # WHATSAPP_APP_SECRET, WHATSAPP_VERIFY_TOKEN and WHATSAPP_TOKEN, or none (see the README).
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
